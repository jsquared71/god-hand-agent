<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>God Hand — Agent Sandbox</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hud-brand">
        <div class="hud-title">God Hand</div>
        <div class="hud-hint">Drag resources into the world</div>
      </div>
      <div class="hud-bars">
        <div class="bar-row">
          <span class="bar-label">Favor</span>
          <div class="bar" aria-label="Favor">
            <div id="favor-fill" class="bar-fill favor"></div>
          </div>
          <span id="favor-value" class="bar-val">10</span>
        </div>
      </div>
      <div class="settler-card">
        <div class="settler-name">Ava</div>
        <div class="bar-row">
          <span class="bar-label">Hunger</span>
          <div class="bar" aria-label="Hunger">
            <div id="ava-hunger-fill" class="bar-fill hunger"></div>
          </div>
          <span id="ava-hunger-val" class="bar-val">70%</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">Energy</span>
          <div class="bar" aria-label="Energy">
            <div id="ava-energy-fill" class="bar-fill energy"></div>
          </div>
          <span id="ava-energy-val" class="bar-val">100%</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">Mood</span>
          <div class="bar" aria-label="Mood">
            <div id="ava-mood-fill" class="bar-fill mood"></div>
          </div>
          <span id="ava-mood-val" class="bar-val">100%</span>
        </div>
        <div class="hud-action">
          <span class="action-kicker">Mind</span>
          <span id="ava-mind">Idle</span>
        </div>
        <div id="ava-inv" class="hud-inv"></div>
      </div>
      <div class="settler-card">
        <div class="settler-name">Bo</div>
        <div class="bar-row">
          <span class="bar-label">Hunger</span>
          <div class="bar" aria-label="Hunger">
            <div id="bo-hunger-fill" class="bar-fill hunger"></div>
          </div>
          <span id="bo-hunger-val" class="bar-val">70%</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">Energy</span>
          <div class="bar" aria-label="Energy">
            <div id="bo-energy-fill" class="bar-fill energy"></div>
          </div>
          <span id="bo-energy-val" class="bar-val">100%</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">Mood</span>
          <div class="bar" aria-label="Mood">
            <div id="bo-mood-fill" class="bar-fill mood"></div>
          </div>
          <span id="bo-mood-val" class="bar-val">100%</span>
        </div>
        <div class="hud-action">
          <span class="action-kicker">Mind</span>
          <span id="bo-mind">Idle</span>
        </div>
        <div id="bo-inv" class="hud-inv"></div>
      </div>
      <div class="camp-status">
        <span class="camp-label">Camp</span>
        <span id="camp-status" class="camp-indicators">
          <span class="camp-indicator" id="camp-fed">Fed</span>
          <span class="camp-indicator" id="camp-housed">Housed</span>
          <span class="camp-indicator" id="camp-tooled">Tooled</span>
          <span class="camp-indicator" id="camp-stocked">Stocked</span>
        </span>
      </div>
      <div class="hud-save-load">
        <button id="save-btn" class="save-load-btn" title="Save world to file">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Save
        </button>
        <button id="load-btn" class="save-load-btn" title="Load world from file">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <polyline points="9 15 12 18 15 15"></polyline>
          </svg>
          Load
        </button>
      </div>
    </div>
    
    <div id="favor-hint" class="favor-hint"></div>

    <div id="toolbar">
      <div class="toolbar-inner">
        <div class="toolbar-label">Raw offerings</div>
        <div class="tools" id="tools"></div>
      </div>
    </div>

    <div id="recipes-hud">
      <div class="recipes-title">Recipes</div>
      <div id="recipes-list"></div>
    </div>

    <div id="drag-chip" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
